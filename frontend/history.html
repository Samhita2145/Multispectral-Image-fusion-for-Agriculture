<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History · Multispectral Image Fusion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/modules.css">
  <link rel="stylesheet" href="css/history.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/chatbot.css">
</head>
<body>

  <div class="bg-glow bg-glow--top-left" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--bottom-right" aria-hidden="true"></div>

  <div class="page">

    <header class="navbar" role="banner">
      <div class="navbar__brand">
        <img src="assets/logo.png" alt="Multispectral Image Fusion logo" class="navbar__logo">
        <div class="navbar__title"><span>Multispectral Image Fusion</span><span>For Agriculture</span></div>
      </div>
      <nav class="navbar__nav" role="navigation" aria-label="Primary">
        <a href="index.html" class="nav-link">Dashboard</a>
        <a href="image-analysis.html" class="nav-link">Image Analysis</a>
        <a href="dataset.html" class="nav-link">Dataset Explorer</a>
        <a href="disease-detection.html" class="nav-link">Disease Detection</a>
        <a href="fusion.html" class="nav-link">Image Fusion</a>
        <a href="reports.html" class="nav-link">Reports</a>
        <a href="history.html" class="nav-link">History</a>
        <a href="about.html" class="nav-link">About</a>
      </nav>
      <div class="navbar__actions">
        <button class="icon-btn" aria-label="Notifications" type="button">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3C9.79 3 8 4.79 8 7V10.5C8 11.03 7.79 11.54 7.41 11.91L6 13.32C5.11 14.21 5.74 15.75 7 15.75H17C18.26 15.75 18.89 14.21 18 13.32L16.59 11.91C16.21 11.54 16 11.03 16 10.5V7C16 4.79 14.21 3 12 3Z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 18.5C9.5 19.88 10.62 21 12 21C13.38 21 14.5 19.88 14.5 18.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="profile-menu-wrap">
          <button class="profile-btn" type="button" aria-label="Account menu">
            <span class="profile-icon"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="8.5" r="3.2" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 20C5.9 16.7 8.7 15 12 15C15.3 15 18.1 16.7 19.5 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="profile-dropdown" id="profileMenu">
            <div class="profile-dropdown__user"><strong>Demo User</strong><span>demo.user@agri.edu</span></div>
            <a href="about.html" class="profile-dropdown__link">About this project</a>
            <a href="login.html" class="profile-dropdown__link profile-dropdown__link--danger">Log out</a>
          </div>
        </div>
      </div>
    </header>

    <main>
      <div class="page-header">
        <div>
          <span class="page-header__eyebrow"><span class="badge__dot"></span> HISTORY</span>
          <h1 class="page-header__title">Previous Analyses</h1>
          <p class="page-header__subtitle">Review, search, and manage every analysis you've run.</p>
        </div>
        <div class="page-header__actions">
          <div class="tabs" style="margin:0;">
            <button class="tab-btn is-active" data-view="cards">Cards</button>
            <button class="tab-btn" data-view="timeline">Timeline</button>
          </div>
        </div>
      </div>

      <div class="section" style="display:flex; align-items:center; gap: var(--space-3); flex-wrap:wrap; justify-content: space-between;">
        <div class="input-icon-wrap" style="max-width:320px;">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.6"/><path d="M21 21L16.5 16.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <input class="input" id="historySearch" placeholder="Search by disease name...">
        </div>
        <select class="select" id="historySort" style="max-width:200px;">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="confidence">Highest confidence</option>
          <option value="severity">Severity</option>
        </select>
      </div>

      <div class="section" id="historyContent"></div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/history.js"></script>
  <script src="js/chatbot.js"></script>
</body>
</html>
